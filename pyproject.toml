[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkit"
version = "0.1"
description = "personal toolkits"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "requests-mock>=1.12.1",
    "ruff>=0.17.3",
    "ty>=0.0.90",
]

[project.scripts]
pkit = "pkit.cli:cli"
wayback = "pkit.wayback.cli:cli"
pk = "pkit.cli:cli"
wb = "pkit.wayback.cli:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["pkit"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["pkit", "tests"]
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint.isort]
known-first-party = ["pkit"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
